[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "decentrlai"
version = "0.1.0"
description = "Evidence-backed automated investigation and relationship intelligence platform."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<1",
    "sqlalchemy>=2.0,<3",
    "asyncpg>=0.29,<1",
    "beautifulsoup4>=4.12,<5",
    "trafilatura>=1.9,<2",
    "langchain-core>=0.2",
    "langchain-ollama>=0.1",
    "pydantic>=2.0",
    "neo4j>=5.24,<6",
    "arq>=0.25,<1",
    "redis>=5.0,<6",
    "duckduckgo-search>=5.0,<6"
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8", "mypy>=1.13"]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.32"]
worker = ["arq", "redis"]

[tool.setuptools.packages.find]
where = ["."]
include = ["packages*", "apps*"]
